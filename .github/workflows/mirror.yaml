name: Mirror main to group repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to mirror (otsun)
        env:
          GH_TOKEN: ${{ secrets.MIRROR_OTSUN_TOKEN }}
          TARGET_REPO: otsun-uib/OTSun
          TARGET_BRANCH: main
        run: |
          git remote add mirror https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git
          git push --force --prune mirror HEAD:${TARGET_BRANCH}
          # opcional: tags
          # git push --tags --force mirror
